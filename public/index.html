<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sportsboard • Live scores</title><meta name="description" content="A local live sports scoreboard for NFL, MLB, NCAA football, NHL and NBA."><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script><script src="/details.js" defer></script></head>
<body><header><div class="brand"><span class="mark">SB</span><div><h1>SPORTSBOARD</h1><p>THE DAILY SCORE WALL</p></div></div><div class="clock"><time id="clock"></time><span id="today"></span></div><button id="fullscreen">Full screen ↗</button></header>
<main><div class="toolbar"><nav aria-label="League" id="leagues"><button data-league="ALL" aria-pressed="true">All sports</button><button data-league="NFL" aria-pressed="false">NFL</button><button data-league="MLB" aria-pressed="false">MLB</button><button data-league="NCAAF" aria-pressed="false">NCAA football</button><button data-league="NHL" aria-pressed="false">NHL</button><button data-league="NBA" aria-pressed="false">NBA</button></nav><div class="date-controls"><button id="previous" aria-label="Previous day">←</button><input type="date" id="date" aria-label="Game date"><button id="next" aria-label="Next day">→</button><button id="reset">Today</button></div></div>
<div class="subbar"><div class="filters" id="filters"><button data-state="all" aria-pressed="true">All games</button><button data-state="in" aria-pressed="false">Live</button><button data-state="pre" aria-pressed="false">Upcoming</button><button data-state="post" aria-pressed="false">Final</button></div><span id="summary" role="status">Connecting to score feed…</span><button id="refresh">Refresh ↻</button></div>
<div id="board"></div></main><footer><span>ESPN score feed · Refreshes every 30 seconds · NCAA Division I</span><span id="zone"></span></footer><dialog id="game-dialog" aria-labelledby="game-title"><div class="detail-toolbar"><h2 id="game-title">Game details</h2><button id="close-detail" aria-label="Close game details">Close ×</button></div><div id="game-content"></div></dialog></body></html>
