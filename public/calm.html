<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="theme-color" content="#000000"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calm</title><link rel="icon" href="/favicon.svg">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
.layer{position:fixed;inset:0;opacity:0;transition:opacity 2.5s ease}
.layer.on{opacity:1}
video{width:100%;height:100%;object-fit:cover;background:#000}
.yt,.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
/* overscale YouTube slightly to hide its edge chrome */
.yt{transform:scale(1.04)}
#clock{position:fixed;right:4vw;bottom:5vh;z-index:5;color:#fff;font:300 7vh/1 -apple-system,'Helvetica Neue',sans-serif;letter-spacing:.02em;text-shadow:0 2px 18px #0009;opacity:.85}
#clock small{display:block;font-size:2.2vh;letter-spacing:.2em;text-transform:uppercase;margin-top:1vh;opacity:.8;text-align:right}
#label{position:fixed;left:4vw;bottom:5vh;z-index:5;color:#fff;font:400 2vh -apple-system,'Helvetica Neue',sans-serif;opacity:0;transition:opacity 1s;text-shadow:0 2px 12px #000}
#label.show{opacity:.7}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#889;font:400 2.4vh -apple-system,sans-serif;text-align:center;padding:10vw}
</style><script src="/calm.js" defer></script></head>
<body><div id="msg"></div><div id="clock" hidden></div><div id="label"></div></body></html>
